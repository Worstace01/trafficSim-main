<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Simulation & Flow Optimizer</title>
    <meta name="description" content="An interactive traffic simulation and congestion optimization model. Built by Andrie Deuna.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 select-none">

    <!-- Header -->
    <header class="max-w-5xl w-full mx-auto flex justify-between items-center bg-slate-900/80 backdrop-blur-md px-6 py-4 rounded-2xl border border-slate-800 shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 bg-cyan-600 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg shadow-cyan-600/30">
                🚦
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-400">Traffic Flow Simulator</h1>
                <p class="text-xs text-slate-400">Congestion & Route Optimization Model</p>
            </div>
        </div>
        <div class="flex items-center gap-3 text-sm font-semibold">
            <div class="bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700">
                Active Vehicles: <span id="vehicleCount" class="text-cyan-400 font-extrabold text-base">0</span>
            </div>
        </div>
    </header>

    <!-- Main Canvas & Controls -->
    <main class="max-w-5xl w-full mx-auto my-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Simulation Canvas (2D Traffic Grid) -->
        <div class="md:col-span-2 bg-slate-900/80 backdrop-blur-xl p-4 rounded-3xl border border-slate-800 shadow-2xl flex flex-col items-center justify-between relative overflow-hidden">
            <canvas id="simCanvas" width="600" height="420" class="w-full h-auto bg-slate-950 rounded-2xl border border-slate-800 shadow-inner cursor-crosshair"></canvas>
        </div>

        <!-- Right Controls & Analytics -->
        <div class="bg-slate-900/80 backdrop-blur-xl p-6 rounded-3xl border border-slate-800 shadow-xl space-y-6 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold text-cyan-200 mb-4 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-cyan-400"></i> Simulation Controls
                </h2>

                <div class="space-y-4">
                    <button id="addCarBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-2xl shadow-lg shadow-cyan-600/25 active:scale-95 transition text-sm flex items-center justify-center gap-2">
                        <i class="fas fa-car-side"></i> Add Vehicles (+5)
                    </button>

                    <button id="toggleLightBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-2xl shadow-lg shadow-emerald-600/25 active:scale-95 transition text-sm flex items-center justify-center gap-2">
                        <i class="fas fa-traffic-light"></i> Switch Traffic Signals
                    </button>

                    <button id="resetSimBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 px-4 rounded-2xl border border-slate-700 active:scale-95 transition text-xs flex items-center justify-center gap-2">
                        <i class="fas fa-redo"></i> Clear Grid & Reset
                    </button>
                </div>
            </div>

            <!-- Live Analytics -->
            <div class="pt-4 border-t border-slate-800 space-y-3 text-sm">
                <h3 class="font-bold text-slate-300">Live Traffic Metrics</h3>
                <div class="flex justify-between text-xs text-slate-400">
                    <span>Average Flow Speed:</span>
                    <span id="avgSpeed" class="font-mono text-emerald-400 font-bold">42 km/h</span>
                </div>
                <div class="flex justify-between text-xs text-slate-400">
                    <span>Signal Cycle:</span>
                    <span id="signalState" class="font-bold text-emerald-400">NORTH-SOUTH GREEN</span>
                </div>
                <div class="flex justify-between text-xs text-slate-400">
                    <span>Intersection Status:</span>
                    <span id="flowStatus" class="font-bold text-cyan-400">Optimal Flow</span>
                </div>
            </div>
        </div>

    </main>

    <footer class="max-w-5xl w-full mx-auto text-center text-xs text-slate-500 py-3">
        &copy; 2026 Traffic Flow Simulator — Created by <a href="https://github.com/Worstace01" target="_blank" class="underline hover:text-slate-300">Andrie Deuna</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
